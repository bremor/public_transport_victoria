name: test suite

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly compatibility check against fresh dependency installs.
    - cron: "0 3 * * 1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Run tests
        # --asyncio-mode=auto is required by the config-flow tests: the HA
        # harness `hass` fixture is an async fixture and this repo has no
        # pytest.ini.  The suite needs no credentials, network or PTV API.
        run: python -m pytest tests -q --asyncio-mode=auto

  capture-skipped:
    # Guards the fixture-capture script: with no secrets file it must exit 0
    # and print the skip notice, never touch the live API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Capture script is inert without credentials
        env:
          PTV_SECRETS_FILE: /nonexistent/ptv.env
        run: |
          python tests/capture_fixtures.py | tee capture.log
          grep -q "skipped (no credentials)" capture.log
